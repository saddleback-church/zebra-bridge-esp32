; zebra-bridge-esp32
; ESP32 BLE -> RS-232 bridge emulating a Zebra ZD421 printer.

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.1.0
extra_scripts = pre:scripts/bridge_config.py
board_build.f_cpu = 80000000L

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@2.1.0
extra_scripts = pre:scripts/bridge_config.py
board_build.f_cpu = 80000000L

; ESP32-S3: native USB host (GPIO19 = D-, GPIO20 = D+) instead of a UART.
; The console stays on UART0 (GPIO43/44) because the OTG pins drive the printer.
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
; DIO instead of the board's default QIO: some S3 SuperMini batches ship with
; XTX (0x46) flash that the IDF 4.4 QIO bootloader cannot switch to quad mode,
; which leaves the board boot-looping with RTC_SW_SYS_RST. DIO works on every
; flash chip and the speed difference does not matter for this firmware.
board_build.flash_mode = dio
board_build.partitions = default.csv
board_build.f_cpu = 80000000L
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DZB_PRINTER_USB=1
lib_deps = h2zero/NimBLE-Arduino@2.1.0
extra_scripts = pre:scripts/bridge_config.py

; Host-only environment used by `pio test -e native`.
; It compiles just the Arduino-free console/flow-filter sources.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<console.cpp> +<flow_filter.cpp>
